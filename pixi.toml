[workspace]
channels = ["https://prefix.dev/conda-forge"]
name = "ting"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
run = "python main.py"

[dependencies]
numpy = ">=2.4,<2.5"
python = ">=3.12,<3.13"
python-sounddevice = "*"
pywin32 = "*"
pynput = "*"
tk = "*"

[pypi-dependencies]
addict = "==2.4.0"
funasr = "==1.3.14"
modelscope = "==1.37.1"
torch = { version = "==2.12.1+cpu", index = "https://download.pytorch.org/whl/cpu" }
torchaudio = { version = "==2.11.0+cpu", index = "https://download.pytorch.org/whl/cpu" }
